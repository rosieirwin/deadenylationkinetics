## Use this file to configure the fitting parameters for the deadenylation assay
## It should be placed in the same directory as the data files to be fit

Sample name: CNOT7X
Data file to fit: CNOT7X_100nMRNA_FRET_data_to_fit.csv
Output plot file: CNOT7X_100nMRNA_FRET_kinetics_fits.pdf
Optimal fit parameter file: CNOT7X_100nMRNA_optimal_fit_params.csv
Experimental parameters:
  n: # polyA RNA length
    Value: 18
  Temperature: 
    Value: 303.15
Modeling parameters:
  Fit: True
  Minimizer: 'nelder'
  Kinetic model: Distributive
  Fit parameters:
    k1:
      Value: 1.0e+10
      Units: s^-1
      Vary: False
      Minimum: 0
    km1:
      Value: 1.0e-08
      Units: s^-1
      Vary: False
      Minimum: 0
    k2:
      Value: 35012.57949831855
      Units: M^-1s^-1
      Vary: True
      Minimum: 0
    km2:
      Value: 12.301730606129253
      Units: s^-1
      Vary: True
      Minimum: 0
    kcat:
      Value: 1.3520002918094773
      Units: s^-1
      Vary: True
      Minimum: 0
    dGo:
      Value: -2.9272 # kJ/mol Empirical value calculated from Sugimoto NAR paper
      Units: kJmol^-1
      Vary: False
      Minimum: -20
    alpha:
      Value: -3.6313 # kJ/mol Empirical value calculated from Sugimoto NAR paper
      Units: kJmol^-1
      Vary: False
      Minimum: -20
  Error estimation:
    Cores: 0  # Number of cores to use for parallel processing; if set to 0, n-1 cores are used where n is the number of cores in the machine
    Monte Carlo:
      Run: True
      Iterations: 2
    Error surfaces:
      Run: True
      Parameter range factor: 2
      Points: 2
Plot parameters:
  Plot mean data: True  # Plot mean data for a given time point (True) vs plot each data point (False) 
  Plot best fit: False  # Include best fit line in plot
  Plot residuals: True  # Plot residuals of the fits vs time (each enzyme concentration residuals shown separately)
  Plot RNA population curves: True  # Plot RNA populations ([A_n], [A_{n-1}],[A_n-2],...) vs time (each enzyme concentration shown separately)
  Plot annealed fraction: False  # Plot fraction of each RNA length annealed to DNA quenching strand (Q) vs time (i.e., simulated FRET signal)
  Plot 2D population bars: False 
  Plot 3D population bars: False