## Use this file to configure the fitting parameters for the deadenylation assay
## It should be placed in the same directory as the data files to be fit

Sample name: CNOT7_two-phases
Data file to fit: ../data/two-phase_FRET_data_to_fit.csv
Partitioning data file: ../data/partitioning_data.csv
Output location: output/
Output plot file: fit_plots.pdf
Optimal fit parameter file: fit_params.csv
Experimental parameters:
  n: # polyA RNA length
    Value: 18
  Temperature: 
    Value: 298.15
Modeling parameters:
  Fit: True # if set to False, will not perform fitting, but will still simulate the data using the provided parameters
  Export simulated data: False # if set to True, will export the simulated curves as a dataset to a CSV file in the output location
  Minimizer: nelder # recommended: 'leastsq' for least squares fitting for refinement, 'nelder' for Nelder-Mead simplex algorithm when stuck in local minima
  Kinetic model: 2phase steady state distributive # this is the only two phase kinetic model currently implemented
  Max function evaluations: 10000
  SS time range: # The time range for the steady state conditions (when the substrate-enzyme complex concentration is constant)
    Export: False # If True, will export the steady state time range to a CSV file in the output location
    Limit: False # If True, will limit the time range for fitting to the steady state time range; if False, will use the entire time range of the data for fitting
    File: output/two-phase_all-float_ss_times.csv
  Fit parameters:
    Dilute parameters:
      kcat:
        Value: 1.0
        Units: s^-1
        Vary: False
        Minimum: 0
        Maximum: inf
      KM:
        Value: 0.000556255
        Units: M
        Vary: False
        Minimum: 0.000000001
        Maximum: inf
    Dense parameters:
      kcat:
        Value: 2.161126e-01
        Units: s^-1
        Vary: True
        Minimum: 0
        Maximum: inf
      KM:
        Value: 1.896409e-03
        Units: M
        Vary: True
        Minimum: 0.000000001
        Maximum: inf

    # dGo and alpha are empirical values calculated from Sugimoto NAR paper; they are not fit parameters, but are used to calculate RNA-DNA annealing free energy for the RNA-DNA hybridization step in the model
    # To calculate these values, use the calculate_hybrid_duplex_free_energy.py script in the scripts directory
    dGo:
      Value: -3.2498 # kJ/mol Empirical value calculated from Sugimoto NAR paper
      Units: kJmol^-1
      Vary: False
      Minimum: -20
      Maximum: 0
    alpha:
      Value: -3.0684 # kJ/mol Empirical value calculated from Sugimoto NAR paper
      Units: kJmol^-1
      Vary: False
      Minimum: -20
      Maximum: 0
  Error estimation:
    Cores: 0  # Number of cores to use for parallel processing; if set to 0, n-1 cores are used where n is the number of cores in the machine
    Monte Carlo: # Error estimation using Monte Carlo simulations; will simulate data using the best fit parameters, add noise according to the RMSD, and refit to estimate error in the fit parameters
      Run: True
      Iterations: 100
      Export simulated data: False
    Error surfaces: # Estimate parameter correlations by calculating the error a certain number of times (Points) across a range of values (Parameter range factor) for each pair of fit parameters; will be plotted as surface plots
      Run: True
      Parameter range factor: 10
      Points: 10
Plot parameters:
  Best fit: 
    Plot best fit: True  # Plot data and best fit line
    Colormap: [[255, 229, 249, 1],[138, 0, 104, 1]]  # Colormap for the plot or [[R, G, B, alpha],[R, G, B, alpha]] values for lightest to darkest color
  xlimits: [0, 4000]  # x-axis limits for the plot (s), set to None if you want the limits to be automatically determined

  Marker shape: 's'  # Marker shape for the data points in the plot
  Plot mean data: True  # Plot mean data for a given time point (True) vs plot each data point (False) 
  Plot residuals: True  # Plot residuals of the fits vs time (each enzyme concentration residuals shown separately)
  Plot RNA population curves: True  # Plot RNA populations ([A_n], [A_{n-1}],[A_n-2],...) vs time (each enzyme concentration shown separately)
  Plot 3D RNA population curves: False  # ONLY IMPLEMENTED FOR SINGLE PHASE; Plot RNA populations ([A_n], [A_{n-1}],[A_n-2],...) vs time vs enzyme concentration
